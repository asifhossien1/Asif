<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>I Love You ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#030003;
    width:100vw;
    height:100vh;
    font-family:Arial,sans-serif;
}

/* =========================
   I LOVE YOU TEXT
========================= */

.loveText{
    position:fixed;
    top:35px;
    left:50%;
    transform:translateX(-50%);

    color:white;
    font-size:34px;
    font-weight:bold;

    white-space:nowrap;

    z-index:100;

    text-shadow:
        0 0 5px white,
        0 0 15px #ff1493,
        0 0 30px #ff00cc;

    animation:
        textMove 2s ease-in-out infinite alternate,
        textGlow 1.5s ease-in-out infinite alternate;
}

@keyframes textMove{

    0%{
        transform:translateX(-50%) translateY(0);
    }

    100%{
        transform:translateX(-50%) translateY(12px);
    }

}

@keyframes textGlow{

    0%{
        text-shadow:
        0 0 5px white,
        0 0 15px #ff1493;
    }

    100%{
        text-shadow:
        0 0 10px white,
        0 0 30px #ff1493,
        0 0 60px #ff00cc;
    }

}


/* =========================
   CANVAS
========================= */

canvas{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
}


/* =========================
   BOTTOM MESSAGE
========================= */

.message{

    position:fixed;

    bottom:30px;

    left:50%;

    transform:translateX(-50%);

    color:white;

    font-size:18px;

    text-align:center;

    z-index:100;

    text-shadow:
        0 0 10px #ff1493,
        0 0 20px #ff1493;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .loveText{
        font-size:28px;
        top:30px;
    }

    .message{
        font-size:15px;
        bottom:20px;
    }

}

</style>

</head>


<body>


<!-- উপরের লেখা -->

<div class="loveText">
    I Love You ❤️
</div>


<!-- Particle Heart -->

<canvas id="canvas"></canvas>


<!-- নিচের লেখা -->

<div class="message">
    You are my everything ❤️
</div>



<script>


const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


let width;
let height;


/* =========================
   CANVAS SIZE
========================= */

function resize(){

    width =
        canvas.width =
        window.innerWidth;

    height =
        canvas.height =
        window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);



/* =========================
   PARTICLES
========================= */

const particles = [];

const particleCount = 4500;



/* =========================
   HEART FORMULA
========================= */

function heartX(t){

    return 16 *
        Math.pow(Math.sin(t),3);

}


function heartY(t){

    return -(
        13 * Math.cos(t)
        - 5 * Math.cos(2*t)
        - 2 * Math.cos(3*t)
        - Math.cos(4*t)
    );

}



/* =========================
   CREATE PARTICLES
========================= */

for(
    let i=0;
    i<particleCount;
    i++
){

    let t =
        Math.random() *
        Math.PI * 2;


    let scale =
        1 +
        Math.random() * 0.35;


    let x =
        heartX(t) *
        scale;


    let y =
        heartY(t) *
        scale;


    particles.push({

        x:x,

        y:y,

        baseX:x,

        baseY:y,

        size:
            Math.random() * 1.8 + 0.4,

        alpha:
            Math.random() * 0.7 + 0.3,

        speed:
            Math.random() * 0.02 + 0.005,

        angle:
            Math.random() *
            Math.PI * 2,

        distance:
            Math.random() * 8

    });

}



/* =========================
   DRAW
========================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
       Heart size
    */

    let scale =
        Math.min(
            width,
            height
        ) / 34;


    /*
       Heart position
    */

    let centerX =
        width / 2;


    let centerY =
        height / 2 + 20;



    particles.forEach(
        p => {

            /*
               Particle movement
            */

            p.angle += p.speed;


            let movingX =
                Math.cos(p.angle)
                * p.distance;


            let movingY =
                Math.sin(p.angle)
                * p.distance;



            let x =
                centerX
                + p.baseX * scale
                + movingX;


            let y =
                centerY
                + p.baseY * scale
                + movingY;



            /*
               Glow
            */

            ctx.shadowBlur = 10;

            ctx.shadowColor =
                "#ff0088";



            /*
               Pink particle
            */

            ctx.fillStyle =
                `rgba(255,0,150,${p.alpha})`;



            ctx.beginPath();

            ctx.arc(
                x,
                y,
                p.size,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }
    );


    requestAnimationFrame(draw);

}


draw();



/* =========================
   TAP HEART EFFECT
========================= */

document.addEventListener(
    "click",
    function(e){

        let heart =
            document.createElement("div");


        heart.innerHTML =
            "❤️";


        heart.style.position =
            "fixed";


        heart.style.left =
            e.clientX + "px";


        heart.style.top =
            e.clientY + "px";


        heart.style.fontSize =
            "30px";


        heart.style.zIndex =
            "200";


        heart.style.pointerEvents =
            "none";


        heart.style.transition =
            "1s";


        document.body.appendChild(
            heart
        );


        setTimeout(
            () => {

                heart.style.transform =
                    "translateY(-100px) scale(2)";

                heart.style.opacity =
                    "0";

            },
            20
        );


        setTimeout(
            () => {

                heart.remove();

            },
            1000
        );

    }
);


</script>

</body>

</html>
