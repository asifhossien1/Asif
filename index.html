<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>I Love You ❤️</title>


<style>

/* =========================
   BASIC
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020002;
    font-family:Arial,sans-serif;
}


/* =========================
   PASSWORD SCREEN
========================= */

#login{
    position:fixed;
    inset:0;

    background:
    radial-gradient(circle,
    #21001e,
    #050005 70%);

    display:flex;
    justify-content:center;
    align-items:center;

    flex-direction:column;

    z-index:9999;
}


#login h2{
    color:#fff;

    font-size:30px;

    margin-bottom:25px;

    text-shadow:
    0 0 10px #ff1493,
    0 0 25px #ff1493;
}


#pass{
    width:260px;

    padding:15px;

    border-radius:30px;

    border:2px solid #ff1493;

    background:#10000f;

    color:white;

    text-align:center;

    font-size:18px;

    outline:none;
}


#login button{

    margin-top:15px;

    padding:13px 40px;

    border:0;

    border-radius:30px;

    background:linear-gradient(
        90deg,
        #ff1493,
        #ff0080
    );

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
    0 0 15px #ff1493;
}


#error{
    color:#ff6b9d;

    margin-top:12px;

    display:none;
}


/* =========================
   MAIN PAGE
========================= */

#main{
    display:none;

    width:100%;
    height:100%;

    position:relative;

    background:
    radial-gradient(
        circle at 50% 45%,
        #25001f 0%,
        #080006 45%,
        #020002 100%
    );
}


/* =========================
   TOP TEXT
========================= */

#loveText{

    position:absolute;

    top:25px;

    left:50%;

    transform:translateX(-50%);

    color:white;

    font-size:30px;

    font-weight:bold;

    white-space:nowrap;

    z-index:20;

    text-shadow:
    0 0 5px white,
    0 0 12px #ff1493,
    0 0 25px #ff1493;

    animation:titleMove 2s
    ease-in-out infinite alternate;
}


@keyframes titleMove{

    from{
        transform:
        translateX(-50%)
        translateY(0);
    }

    to{
        transform:
        translateX(-50%)
        translateY(8px);
    }

}


/* =========================
   CANVAS
========================= */

canvas{

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:100%;
}


/* =========================
   TAP HEART
========================= */

.tapHeart{

    position:fixed;

    pointer-events:none;

    font-size:30px;

    z-index:100;

    animation:
    tapAnimation 1s forwards;
}


@keyframes tapAnimation{

    0%{
        opacity:1;
        transform:
        translate(-50%,-50%)
        scale(.5);
    }

    100%{
        opacity:0;
        transform:
        translate(-50%,-150%)
        scale(2);
    }

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    #loveText{
        font-size:27px;
        top:25px;
    }

    #login h2{
        font-size:27px;
    }

}

</style>

</head>


<body>


<!-- =====================
     PASSWORD
===================== -->

<div id="login">

    <h2>Enter Password ❤️</h2>

    <input
        id="pass"
        type="password"
        placeholder="Password">

    <button onclick="checkPassword()">
        Open ❤️
    </button>

    <div id="error">
        Wrong Password 😐
    </div>

</div>



<!-- =====================
     MAIN
===================== -->

<div id="main">


    <!-- TOP TEXT -->

    <div id="loveText">
        I Love You ❤️
    </div>


    <!-- PARTICLE ANIMATION -->

    <canvas id="canvas"></canvas>


</div>



<script>


/* =================================
   PASSWORD
================================= */

function checkPassword(){

    let password =
        document.getElementById("pass").value;

    if(password === "FARIHA"){

        document.getElementById("login")
        .style.display="none";

        document.getElementById("main")
        .style.display="block";

        startAnimation();

    }

    else{

        document.getElementById("error")
        .style.display="block";

    }

}



/* =================================
   CANVAS
================================= */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");


let W;
let H;


function resize(){

    W =
    canvas.width =
    window.innerWidth;

    H =
    canvas.height =
    window.innerHeight;

}


resize();

window.addEventListener(
    "resize",
    resize
);



/* =================================
   PARTICLES
================================= */

let particles=[];

const COUNT=6000;



/* =================================
   HEART POSITION
================================= */

function heartPoint(t){

    let x =
    16 *
    Math.pow(Math.sin(t),3);


    let y =
    -(
        13*Math.cos(t)
        -
        5*Math.cos(2*t)
        -
        2*Math.cos(3*t)
        -
        Math.cos(4*t)
    );


    return {
        x:x,
        y:y
    };

}



/* =================================
   CREATE PARTICLES
================================= */

function createParticles(){

    particles=[];


    for(let i=0;i<COUNT;i++){

        let t =
        Math.random() *
        Math.PI * 2;


        let point =
        heartPoint(t);


        /*
          Heart-এর ভিতরের random position
        */

        let inside =
        Math.sqrt(Math.random());


        let x =
        point.x * inside;


        let y =
        point.y * inside;


        /*
          চারদিকে ছড়িয়ে যাওয়ার position
        */

        let angle =
        Math.random() *
        Math.PI * 2;


        let distance =
        250 +
        Math.random()*450;


        particles.push({

            x:
            W/2 +
            (Math.random()-0.5)*W,

            y:
            H/2 +
            (Math.random()-0.5)*H,


            targetX:x,

            targetY:y,


            scatterX:
            Math.cos(angle)*distance,

            scatterY:
            Math.sin(angle)*distance,


            size:
            Math.random()*1.5+0.5,


            alpha:
            Math.random()*0.7+0.3,


            phase:
            Math.random()*Math.PI*2,


            speed:
            Math.random()*0.03+0.01

        });

    }

}



/* =================================
   ANIMATION VARIABLES
================================= */

let startTime;

let running=false;



function startAnimation(){

    if(running) return;

    running=true;

    createParticles();

    startTime=
    performance.now();

    requestAnimationFrame(
        animate
    );

}



/* =================================
   DRAW RINGS
================================= */

function drawRings(cx,cy,time){

    ctx.save();


    for(let i=0;i<7;i++){

        let radius =
        55 +
        i*18 +
        Math.sin(
            time*0.002+i
        )*5;


        ctx.beginPath();


        ctx.ellipse(
            cx,
            cy,
            radius*1.8,
            radius*.35,
            0,
            0,
            Math.PI*2
        );


        ctx.strokeStyle =
        `rgba(255,50,190,
        ${0.25-i*0.025})`;


        ctx.lineWidth=1.2;


        ctx.shadowBlur=8;

        ctx.shadowColor="#ff1493";


        ctx.stroke();

    }


    ctx.restore();

}



/* =================================
   MAIN ANIMATION
================================= */

function animate(time){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    let elapsed =
    (time-startTime)/1000;


    /*
       Heart size
    */

    let scale =
    Math.min(W,H)/36;


    let cx =
    W/2;


    let cy =
    H/2+25;


    /*
       8 second cycle
    */

    let cycle =
    elapsed%8;



    /*
       0-2 sec:
       particles come together
    */

    let formation;


    if(cycle<2){

        formation =
        cycle/2;

    }

    /*
       2-5 sec:
       heart stays
    */

    else if(cycle<5){

        formation=1;

    }

    /*
       5-8 sec:
       heart breaks apart
    */

    else{

        formation =
        1-(cycle-5)/3;

    }



    /*
       Smooth movement
    */

    formation =
    formation*formation*
    (3-2*formation);



    /* =========================
       PARTICLES
    ========================= */

    particles.forEach(p=>{

        /*
           Slight movement
        */

        let waveX =
        Math.sin(
            time*p.speed*0.02+
            p.phase
        )*3;


        let waveY =
        Math.cos(
            time*p.speed*0.02+
            p.phase
        )*3;



        /*
           Target Heart
        */

        let targetX =
        cx+
        p.targetX*scale+
        waveX;


        let targetY =
        cy+
        p.targetY*scale+
        waveY;



        /*
           Scatter
        */

        let scatterX =
        cx+
        p.scatterX;


        let scatterY =
        cy+
        p.scatterY;



        /*
           Current position
        */

        p.x =
        scatterX*(1-formation)+
        targetX*formation;


        p.y =
        scatterY*(1-formation)+
        targetY*formation;



        /*
           Pink particle
        */

        ctx.beginPath();


        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );


        ctx.fillStyle =
        `rgba(
            255,
            ${20+Math.random()*70},
            ${120+Math.random()*100},
            ${p.alpha}
        )`;


        ctx.shadowBlur=8;

        ctx.shadowColor="#ff0088";


        ctx.fill();

    });



    /*
       Rings নিচে থাকবে
    */

    drawRings(
        cx,
        cy+scale*13,
        time
    );



    /*
       আবার animate
    */

    requestAnimationFrame(
        animate
    );

}



/* =================================
   TAP EFFECT
================================= */

document.addEventListener(
    "click",
    function(e){

        if(
            document.getElementById(
                "main"
            ).style.display !== "block"
        ){
            return;
        }


        let heart =
        document.createElement("div");


        heart.className=
        "tapHeart";


        heart.innerHTML="❤️";


        heart.style.left=
        e.clientX+"px";


        heart.style.top=
        e.clientY+"px";


        document.body.appendChild(
            heart
        );


        setTimeout(
            ()=>{
                heart.remove();
            },
            1000
        );

    }
);


</script>


</body>
  </html>
